<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Imagem de prévia de link (1200x630)</title>
<style>
  /* Modelo da imagem de prévia (og-image.png / og-orcamento.png). Ver LEIAME.md. */
  @font-face { font-family: 'JetBrains Mono'; font-weight: 100 800; src: url('/node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 100 900; src: url('/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2'); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; background: #000; overflow: hidden; }
  body { position: relative; color: #f5f5f5; font-family: 'Inter', sans-serif; }
  .grid { position: absolute; inset: 0; background-image: radial-gradient(circle, #4a4a4a 1.5px, transparent 2px); background-size: 32px 32px;
    -webkit-mask-image: radial-gradient(ellipse 85% 100% at 15% 10%, #000 0%, transparent 72%); mask-image: radial-gradient(ellipse 85% 100% at 15% 10%, #000 0%, transparent 72%); opacity: .55; }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 660px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
  .prompt { font: 500 26px 'JetBrains Mono'; color: #8a8a8a; letter-spacing: .04em; }
  h1 { font: 800 104px/1 'JetBrains Mono'; letter-spacing: -.05em; }
  .lead { font: 600 42px/1.18 'Inter'; letter-spacing: -.02em; color: #f5f5f5; max-width: 620px; }
  .lead mark { background: #f5f5f5; color: #000; padding: 0 .14em; }
  .meta { font: 500 25px/1.3 'JetBrains Mono'; color: #a3a3a3; letter-spacing: .01em; }
  .url { position: absolute; left: 72px; bottom: 44px; font: 500 22px 'JetBrains Mono'; color: #8a8a8a; letter-spacing: .02em; }
  .panel { position: absolute; right: 72px; top: 115px; width: 400px; height: 400px; border: 2px solid #6e6e6e; background: #161616; display: grid; place-items: center; }
  .panel svg { width: 300px; height: 300px; shape-rendering: crispEdges; }
</style>
</head>
<body>
<div class="grid"></div>
<div class="copy">
  <p class="prompt" id="prompt"></p>
  <h1 id="title"></h1>
  <p class="lead" id="lead"></p>
  <p class="meta" id="meta"></p>
</div>
<p class="url">portfolio.axeldev.workers.dev</p>
<div class="panel"><svg viewBox="0 0 16 16" aria-hidden="true"><rect fill="#f5f5f5" x="6" y="1" width="4" height="1"/><rect fill="#f5f5f5" x="5" y="2" width="6" height="1"/><rect fill="#f5f5f5" x="3" y="3" width="9" height="1"/><rect fill="#f5f5f5" x="2" y="4" width="7" height="1"/><rect fill="#e3262b" x="9" y="4" width="2" height="1"/><rect fill="#f5f5f5" x="11" y="4" width="2" height="1"/><rect fill="#f5f5f5" x="2" y="5" width="7" height="1"/><rect fill="#e3262b" x="9" y="5" width="2" height="1"/><rect fill="#f5f5f5" x="11" y="5" width="3" height="1"/><rect fill="#f5f5f5" x="1" y="6" width="14" height="1"/><rect fill="#f5f5f5" x="1" y="7" width="15" height="1"/><rect fill="#f5f5f5" x="0" y="8" width="10" height="1"/><rect fill="#f5f5f5" x="15" y="8" width="1" height="1"/><rect fill="#f5f5f5" x="0" y="9" width="9" height="1"/><rect fill="#f5f5f5" x="1" y="10" width="8" height="1"/><rect fill="#f5f5f5" x="2" y="11" width="8" height="1"/><rect fill="#f5f5f5" x="4" y="12" width="6" height="1"/><rect fill="#f5f5f5" x="6" y="13" width="5" height="1"/><rect fill="#f5f5f5" x="8" y="14" width="3" height="1"/></svg></div>
<script>
  const variants = {
    home: { prompt: '$ whoami', title: 'The Crow', lead: 'Sistemas web <mark>seguros</mark>, do banco de dados à interface.', meta: 'Endriky Axel<br>full stack · segurança da informação' },
    orcamento: { prompt: '$ orcamento --novo', title: 'Orçamento', lead: 'Monte o orçamento do seu <mark>projeto</mark>, sem cadastro.', meta: 'Escolha o que precisa<br>veja a estimativa · envie pelo WhatsApp' },
  }
  const v = variants[new URLSearchParams(location.search).get('v') ?? 'home']
  document.getElementById('prompt').textContent = v.prompt
  document.getElementById('title').textContent = v.title
  document.getElementById('lead').innerHTML = v.lead
  document.getElementById('meta').innerHTML = v.meta
</script>
</body>
</html>

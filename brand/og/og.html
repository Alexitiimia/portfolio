<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Imagem de prévia de link (1200x630)</title>
<style>
  /* Modelo da imagem de prévia (og-image.png / og-orcamento.png). Ver LEIAME.md.
     Tudo que importa fica no quadrado central de 630x630 (x de 285 a 915): sites que cortam a prévia em
     quadrado, como o bio.site, mostram o mesmo conjunto completo, sem pedaços de texto. */
  @font-face { font-family: 'JetBrains Mono'; font-weight: 100 800; src: url('/node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 100 900; src: url('/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2'); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; background: #000; overflow: hidden; }
  body { position: relative; color: #f5f5f5; font-family: 'Inter', sans-serif; }
  .grid { position: absolute; inset: 0; background-image: radial-gradient(circle, #4a4a4a 1.5px, transparent 2px); background-size: 32px 32px;
    -webkit-mask-image: radial-gradient(ellipse 60% 90% at 50% 45%, #000 0%, transparent 75%); mask-image: radial-gradient(ellipse 60% 90% at 50% 45%, #000 0%, transparent 75%); opacity: .5; }
  .center { position: absolute; left: 285px; top: 0; width: 630px; height: 630px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 16px; padding: 0 36px 26px; }
  .icon { width: 190px; height: 190px; border-radius: 22%; margin-bottom: 6px; }
  h1 { font: 800 92px/1 'JetBrains Mono'; letter-spacing: -.05em; }
  .lead { font: 600 33px/1.2 'Inter'; letter-spacing: -.02em; color: #f5f5f5; max-width: 540px; }
  .lead mark { background: #f5f5f5; color: #000; padding: 0 .14em; }
  .meta { font: 500 22px/1.35 'JetBrains Mono'; color: #a3a3a3; letter-spacing: .01em; }
  .url { position: absolute; left: 285px; width: 630px; text-align: center; bottom: 30px; font: 500 20px 'JetBrains Mono'; color: #8a8a8a; letter-spacing: .02em; }
</style>
</head>
<body>
<div class="grid"></div>
<div class="center">
  <img class="icon" src="/public/icon-512.png" alt="" />
  <h1 id="title"></h1>
  <p class="lead" id="lead"></p>
  <p class="meta" id="meta"></p>
</div>
<p class="url">portfolio.axeldev.workers.dev</p>
<script>
  const variants = {
    home: { title: 'The Crow', lead: 'Sistemas web <mark>seguros</mark>, do banco de dados à interface.', meta: 'Endriky Axel<br>full stack · segurança da informação' },
    orcamento: { title: 'Orçamento', lead: 'Monte o orçamento do seu <mark>projeto</mark>, sem cadastro.', meta: 'Escolha o que precisa<br>veja a estimativa · envie pelo WhatsApp' },
  }
  const v = variants[new URLSearchParams(location.search).get('v') ?? 'home']
  document.getElementById('title').textContent = v.title
  document.getElementById('lead').innerHTML = v.lead
  document.getElementById('meta').innerHTML = v.meta
</script>
</body>
</html>

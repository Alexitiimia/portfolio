<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Orçamento · The Crow</title>
    <meta
      name="description"
      content="Monte o orçamento do seu site, loja ou sistema, veja a estimativa e envie o resumo pronto para o WhatsApp. Sem cadastro e sem pagar nada agora."
    />

    <meta name="author" content="Endriky Axel" />

    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <!-- Prévia do link (WhatsApp, Instagram, bio.site). Quando houver domínio: og:url e og:image (URL absoluta). -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="The Crow" />
    <meta property="og:title" content="Orçamento · The Crow" />
    <meta
      property="og:description"
      content="Monte o orçamento do seu site, loja ou sistema, veja a estimativa e envie o resumo pronto para o WhatsApp. Sem cadastro e sem pagar nada agora."
    />
    <meta name="twitter:card" content="summary" />

    <!-- Ícones da identidade (brand/favicons/5-silhueta-olho): corvo preto (favicon.svg) e o .ico de reserva. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Aplica o tema salvo antes da primeira pintura (evita "flash" de tema errado). -->
    <script src="/theme-init.js"></script>
  </head>

    <div id="root"></div>
    <noscript>
      <p>Esta página precisa de JavaScript para funcionar.</p>

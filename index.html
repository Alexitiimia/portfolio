<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />

    <meta name="author" content="Endriky Axel" />

    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <!--
      Prévia do link (WhatsApp, Instagram, Discord, X/Twitter, Telegram, LinkedIn, bio.site).
      As URLs precisam ser ABSOLUTAS: ao trocar de domínio, troque SITE_ORIGIN em src/i18n/lang.ts.
      A imagem (1200x630) vem de brand/og/ (ver LEIAME.md).
      Este arquivo é um MODELO: os marcadores entre chaves duplas (título, descrição, idioma...) são preenchidos, um
      idioma por vez, por vite.i18n.ts com os textos de src/i18n/meta.ts. Sai um HTML por idioma
      (dist/pt/, dist/en/, dist/es/).
    -->
    <link rel="canonical" href="{{url}}" />
    {{alternates}}
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="{{ogLocale}}" />
    {{ogLocaleAlternates}}
    <meta property="og:site_name" content="The Crow" />
    <meta property="og:url" content="{{url}}" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:image" content="{{image}}" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{imageAlt}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{description}}" />
    <meta name="twitter:image" content="{{image}}" />
    <meta name="twitter:image:alt" content="{{imageAlt}}" />

    <!-- Ícones da identidade: cabeça do corvo sobre quadrado arredondado (favicon.ico em 16/32/48 e apple-touch-icon). -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Aplica o tema salvo antes da primeira pintura (evita "flash" de tema errado). -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>{{noscript}}</p>
      <p><a href="{{noscriptHref}}">{{noscriptLink}}</a></p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>CORVO · Full stack e segurança da informação</title>
    <meta
      name="description"
      content="Sites de vendas, gestão financeira, automações e análise de segurança. Front-end e back-end, com domínio grátis por 1 ano e suporte 24h."
    />

    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <!-- Prévia do link (WhatsApp, Instagram, bio.site). Quando houver domínio: og:url e og:image (URL absoluta). -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="CORVO" />
    <meta property="og:title" content="CORVO · Full stack e segurança da informação" />
    <meta
      property="og:description"
      content="Sites de vendas, gestão financeira, automações e análise de segurança. Front-end e back-end, com domínio grátis por 1 ano e suporte 24h."
    />
    <meta name="twitter:card" content="summary" />

    <!-- Ícones da identidade (variante 1-poleiro de brand/favicons). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Aplica o tema salvo antes da primeira pintura (evita "flash" de tema errado). -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>Este site precisa de JavaScript para funcionar.</p>
      <p><a href="https://github.com/Alexitiimia">github.com/Alexitiimia</a></p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
